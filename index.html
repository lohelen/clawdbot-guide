        :root {
            --accent-red: #FF4D4D;
            --bg-dark: #050505;
            --bg-card: #0F0F0F;
            --border-color: #1A1A1A;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;

        /* 導航欄 */
        nav {
            height: var(--nav-height);
            background: rgba(5, 5, 5, 0.85);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .nav-left { display: flex; align-items: center; gap: 30px; }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon svg { fill: var(--accent-red); width: 32px; height: 32px; filter: drop-shadow(0 0 8px rgba(255, 77, 77, 0.3)); }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 0.9rem; 
            transition: 0.3s; 
            font-weight: 600; 
            cursor: pointer;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

        .lang-select-wrapper { position: relative; }
        .lang-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            padding-right: 30px;
        }
        .lang-select-wrapper::after {
            content: '▼';
            font-size: 0.6rem;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 120px 20px 100px;
        }

        /* SPA 視圖動畫 */
        .view { display: none; animation: fadeIn 0.4s ease-out; }
        .view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero */
        .hero { text-align: center; padding: 60px 0 80px; }
        .hero-logo svg { width: 80px; height: 80px; fill: var(--accent-red); filter: drop-shadow(0 0 20px rgba(255, 77, 77, 0.4)); margin-bottom: 24px; }
        .hero h1 { font-size: clamp(3rem, 10vw, 5rem); font-weight: 800; letter-spacing: -3px; margin-bottom: 16px; background: linear-gradient(to bottom, #FFFFFF 60%, #A0A0A0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #BBBBBB; font-size: 1.3rem; max-width: 800px; margin: 0 auto; line-height: 1.5; }

        .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: '>'; color: var(--accent-red); }

        /* 終端機 */
        .terminal { background: #000; border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; font-family: 'JetBrains Mono', monospace; position: relative; margin-bottom: 20px; }
        .copy-trigger { position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }

        /* 安裝指南 (預設展開) */
        .accordion { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; margin-bottom: 60px; }
        .accordion-header { padding: 20px 24px; background: #121212; font-weight: 700; cursor: default; }
        .accordion-content { padding: 32px; background: var(--bg-card); }

        /* 技能卡片 Box 設計 */
        .skill-box {
            background: #0A0A0A;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            transition: 0.3s;
            position: relative;
        }
        .skill-box:hover { border-color: var(--accent-red); box-shadow: 0 10px 40px rgba(255, 77, 77, 0.05); }
        .skill-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 20px; }
        .skill-title-group h2 { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
        .skill-tag { background: rgba(255, 77, 77, 0.1); color: var(--accent-red); padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        
        .skill-description { color: var(--text-muted); font-size: 1.05rem; line-height: 1.8; margin-bottom: 30px; }
        .skill-description b { color: #fff; }

        .install-btn {
            background: var(--accent-red);
            color: #fff;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            transition: 0.3s;
            display: inline-block;
        }
        .install-btn:hover { transform: scale(1.05); filter: brightness(1.1); box-shadow: 0 0 20px rgba(255, 77, 77, 0.4); }

        /* 網格系統 */
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .grid-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 32px; border-radius: 16px; transition: 0.3s; display: flex; flex-direction: column; gap: 16px; }
        .grid-card:hover { border-color: var(--accent-red); transform: translateY(-4px); }
        .grid-icon-svg { width: 32px; height: 32px; stroke: var(--accent-red); fill: none; stroke-width: 2; }

        /* 影片 */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        .video-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .thumb-container { position: relative; width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: var(--accent-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .play-btn svg { fill: #fff; width: 24px; height: 24px; margin-left: 4px; }

        footer { text-align: center; padding: 80px 20px; color: #444; font-size: 0.8rem; border-top: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero h1 { font-size: 2.8rem; }
            .skill-box { padding: 24px; }
            .skill-header { flex-direction: column; }
            .install-btn { width: 100%; text-align: center; }

        function navigateTo(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            const activeId = viewId === 'home' ? 'nav-install' : 'nav-skills';
            document.getElementById(activeId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function switchLang(lang) {
            if(!contentData[lang]) lang = 'zh-tw';
            document.getElementById('langSelector').value = lang;
            const data = contentData[lang];
            
            if (data['page-title']) document.title = data['page-title'];

            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (data[key]) el.innerHTML = data[key];
            });
            
            document.querySelectorAll('[data-lang-nav]').forEach(el => {
                const key = el.getAttribute('data-lang-nav');
                if (data[key]) el.innerText = data[key];
            });

            // 更新特色功能
            const featContainer = document.getElementById('features-container');
            featContainer.innerHTML = data.features.map(f => `
                <div class="grid-card">
                    <svg class="grid-icon-svg" viewBox="0 0 24 24">${icons[f.icon]}</svg>
                    <h3>${f.title}</h3>
                    <p>${f.desc}</p>
                </div>
            `).join('');

            // 更新安裝步驟 (1-6)
            const tutBody = document.getElementById('tutorial-body-content');
            let stepsHtml = data.steps.map(s => `
                <div style="margin-bottom:24px; border-left: 2px solid var(--accent-red); padding-left: 20px;">
                    <h4 style="color:#fff; margin-bottom:8px; font-size: 1.1rem;">${s.n}. ${s.t}</h4>
                    <p style="color:var(--text-muted); font-size:0.95rem; line-height: 1.6;">${s.c}</p>
                </div>
            `).join('');
            // 在最後一步後添加提示
            stepsHtml += `<div style="margin-top:20px; color:var(--accent-red); font-weight:700; font-size: 1rem;">🔥 ${data['video-mention']}</div>`;
            tutBody.innerHTML = stepsHtml;

            // 更新影片列表
            const videoContainer = document.getElementById('video-grid-container');
            videoContainer.innerHTML = data.video_items.map(v => `
                <div class="video-card" onclick="playVideo(this, '${v.id}')">
                    <div class="thumb-container" style="background-image: url('https://img.youtube.com/vi/${v.id}/maxresdefault.jpg');">
                        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    </div>
                    <div style="padding:20px;">
                        <span style="font-size:0.7rem; color:var(--accent-red); font-weight:800; display:block; margin-bottom:5px;">${v.tag}</span>
                        <div style="font-weight:700; color:#fff;">${v.title}</div>
                    </div>
                </div>
            `).join('');

            // 更新 Skills 內容
            const skillsContainer = document.getElementById('skills-page-container');
            skillsContainer.innerHTML = data.skills_data.map(sk => `
                <div class="skill-box">
                    <div class="skill-header">
                        <div class="skill-title-group">
                            <span class="skill-tag">${sk.tag}</span>
                            <h2>${sk.title}</h2>
                        </div>
                        <a href="${sk.link}" target="_blank" class="install-btn">${sk.btnText}</a>
                    </div>
                    <div class="skill-description">${sk.desc}</div>
                </div>
            `).join('');
        }

        function copyCode(btn) {
            const code = btn.nextElementSibling.querySelector('code').innerText;
            const temp = document.createElement('textarea');
            temp.value = code;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy', 2000);
        }

        function playVideo(card, id) {
            const container = card.querySelector('.thumb-container');
            container.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            card.onclick = null;
        }

        window.onload = () => {
            const browserLang = navigator.language.toLowerCase();
            let target = 'zh-tw';
            if (browserLang.includes('zh-cn')) target = 'zh-cn';
            else if (browserLang.includes('ko')) target = 'ko';
            else if (browserLang.includes('ja')) target = 'ja';
            else if (browserLang.includes('th')) target = 'th';
            else if (browserLang.includes('vi')) target = 'vi';
            else if (browserLang.includes('en')) target = 'en';
            switchLang(target);
        };
    </script>
